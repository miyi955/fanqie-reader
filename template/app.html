<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄小说 · 书架</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c0392b'/%3E%3Cpath d='M9 9h14v3H9zm0 6h14v3H9zm0 6h9v3H9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#faf8f5; --fg:#2b2724; --sub:#8a827a; --line:#e6e0d8;
    --card:#ffffff; --accent:#c0392b; --sel:#f3ece4; --ok:#2d7a4a; --warn:#c47c20;
    --shadow:0 2px 8px rgba(0,0,0,.09),0 8px 24px rgba(0,0,0,.05);
    --font:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#1a1a1c; --fg:#c9c6c1; --sub:#7d7973; --line:#302e2c;
    --card:#212123; --accent:#e07a6a; --sel:#2b2927;
    --shadow:0 2px 8px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
  html[data-variant="warm"]{
    --bg:#f7efe2; --fg:#3d3428; --sub:#8d7f68; --line:#e3d6bf;
    --card:#fdf8ef; --accent:#a0522d; --sel:#efe3cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);font-family:var(--sans);
    transition:background .2s,color .2s;overflow:hidden;
    display:flex;flex-direction:column;
  }
  ::selection{background:var(--accent);color:#fff}

  /* ============ 顶栏 ============ */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:14px 26px;border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  h1{font-family:var(--font);font-size:18px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
  .count{color:var(--sub);font-size:12px;white-space:nowrap}
  .spacer{flex:1}

  button{
    font-family:var(--sans);font-size:13px;color:var(--fg);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,opacity .15s;white-space:nowrap;
  }
  button:hover:not(:disabled){background:var(--sel);border-color:var(--sub)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.icon{padding:7px 10px;line-height:1}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
  button.sm{font-size:12px;padding:5px 10px;border-radius:7px}

  input[type=text],input[type=search]{
    font-family:var(--sans);font-size:13px;color:var(--fg);
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;outline:none;transition:border-color .15s;
  }
  input:focus{border-color:var(--accent)}
  input::placeholder{color:var(--sub)}

  /* ============ 工具条 ============ */
  .toolbar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:12px 26px;border-bottom:1px solid var(--line);
  }
  .chip{
    font-size:12.5px;padding:5px 12px;border-radius:16px;cursor:pointer;
    border:1px solid var(--line);color:var(--sub);background:transparent;
    transition:all .15s;user-select:none;
  }
  .chip:hover{color:var(--fg);border-color:var(--sub)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip b{font-weight:600;opacity:.75;margin-left:4px}
  #q{width:200px;margin-left:auto}

  /* ============ 书架 ============ */
  main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden}
  .grid{
    display:grid;gap:26px 22px;padding:24px 26px 80px;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-content:start;
  }
  @media (min-width:1000px){
    .grid{grid-template-columns:repeat(auto-fill,172px);justify-content:start}
  }
  .book{position:relative;display:flex;flex-direction:column}
  .coverwrap{
    position:relative;cursor:pointer;transition:transform .18s ease;
  }
  .coverwrap:hover{transform:translateY(-3px)}
  .cover{
    position:relative;width:100%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;
    background:var(--sel);box-shadow:var(--shadow);transition:box-shadow .18s ease;
  }
  .coverwrap:hover .cover{box-shadow:0 4px 14px rgba(0,0,0,.14),0 12px 32px rgba(0,0,0,.09)}
  .cover .bg{
    position:absolute;inset:-10%;width:120%;height:120%;
    object-fit:cover;filter:blur(16px) saturate(1.15) brightness(.82);opacity:.85;
  }
  .cover .fg{position:relative;width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.22))}
  .cover .ph{
    position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    padding:16px;text-align:center;font-family:var(--font);font-size:14px;line-height:1.5;
    color:var(--sub);word-break:break-all;
  }
  .badge{
    position:absolute;top:7px;right:7px;font-size:10.5px;padding:2px 7px;border-radius:4px;
    background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(4px);letter-spacing:.02em;
  }
  .badge.done{background:rgba(45,122,74,.88)}
  .badge.part{background:rgba(196,124,32,.9)}
  .badge.off{background:rgba(90,90,90,.8)}
  .progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.25)}
  .progress i{display:block;height:100%;background:var(--accent)}
  .progress.run i{background:linear-gradient(90deg,var(--accent),var(--warn));animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  .meta{padding:9px 2px 0}
  .title{
    font-family:var(--font);font-size:13.5px;font-weight:600;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:2.9em;
  }
  .sub{font-size:11.5px;color:var(--sub);margin-top:3px;display:flex;gap:5px;align-items:center;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .sub .dot{opacity:.45}

  /* 每本书的操作条 */
  .ops{
    display:flex;align-items:center;gap:5px;margin-top:7px;
    opacity:.55;transition:opacity .15s;
  }
  .book:hover .ops{opacity:1}
  .switch{
    display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:var(--sub);
    user-select:none;white-space:nowrap;
  }
  .switch input{display:none}
  .switch i{
    width:26px;height:15px;border-radius:8px;background:var(--line);
    position:relative;transition:background .18s;flex:0 0 auto;
  }
  .switch i::after{
    content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
    background:#fff;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked + i{background:var(--accent)}
  .switch input:checked + i::after{transform:translateX(11px)}
  .switch.locked{opacity:.45;cursor:not-allowed}
  .switch.on-label{color:var(--fg)}
  .more{
    margin-left:auto;padding:3px 7px;border-radius:6px;border:1px solid transparent;
    background:transparent;color:var(--sub);cursor:pointer;font-size:14px;line-height:1;
  }
  .more:hover{background:var(--sel);border-color:var(--line);color:var(--fg)}

  /* ============ 空状态 ============ */
  .empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--sub)}
  .empty h2{font-family:var(--font);font-size:17px;font-weight:500;margin-bottom:14px;color:var(--fg)}
  .empty p{font-size:13px;line-height:1.9}
  .empty button{margin-top:18px}

  /* ============ 弹层 ============ */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:90;
    display:none;align-items:center;justify-content:center;padding:24px;
    backdrop-filter:blur(2px);
  }
  .mask.show{display:flex}
  .modal{
    background:var(--card);border-radius:14px;width:min(620px,100%);
    max-height:min(82vh,760px);display:flex;flex-direction:column;
    box-shadow:0 24px 64px rgba(0,0,0,.28);border:1px solid var(--line);
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-hd{
    padding:18px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .modal-hd h2{font-family:var(--font);font-size:16px;font-weight:600}
  .modal-bd{padding:18px 22px;overflow-y:auto;flex:1}
  .modal-ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}

  .addrow{display:flex;gap:9px}
  .addrow input{flex:1}
  .hintline{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}
  .hintline code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    background:var(--sel);padding:1.5px 6px;border-radius:4px;
  }

  .results{margin-top:18px;display:flex;flex-direction:column;gap:2px}
  .result{
    display:flex;gap:12px;align-items:center;padding:10px;border-radius:9px;
    transition:background .13s;
  }
  .result:hover{background:var(--sel)}
  .result .n{
    font-size:11px;color:var(--sub);width:18px;flex:0 0 auto;text-align:right;
  }
  .result .body{flex:1;min-width:0}
  .result .rt{font-family:var(--font);font-size:14px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .result .ra{font-size:11.5px;color:var(--sub);margin-top:2px}
  .result .tag{font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--sel);color:var(--sub);flex:0 0 auto}
  .result .tag.fin{background:rgba(45,122,74,.14);color:var(--ok)}
  .result .tag.mine{background:rgba(192,57,43,.14);color:var(--accent)}
  .result button{flex:0 0 auto}

  /* ============ 进度坞 ============ */
  .dock{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140%);
    width:min(560px,calc(100% - 40px));z-index:80;
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    box-shadow:0 14px 44px rgba(0,0,0,.22);padding:13px 17px;
    transition:transform .28s cubic-bezier(.2,.9,.3,1);
  }
  .dock.show{transform:translateX(-50%) translateY(0)}
  .dock-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .dock-title{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dock-sub{font-size:11.5px;color:var(--sub);white-space:nowrap}
  .track{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .track i{display:block;height:100%;background:var(--accent);transition:width .25s ease;border-radius:3px}
  .dock-foot{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:var(--sub)}

  /* ============ 右键菜单 ============ */
  .ctx{
    position:fixed;z-index:95;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:5px;box-shadow:0 10px 32px rgba(0,0,0,.24);display:none;min-width:158px;
  }
  .ctx.show{display:block}
  .ctx button{
    display:block;width:100%;text-align:left;border:none;border-radius:6px;
    padding:7px 11px;font-size:12.5px;background:transparent;
  }
  .ctx button:hover{background:var(--sel)}
  .ctx button.danger{color:var(--accent)}
  .ctx hr{border:none;border-top:1px solid var(--line);margin:4px 0}

  /* ============ 提示 ============ */
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(12px);
    background:rgba(30,28,26,.9);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:20px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    header{padding:12px 14px}
    .toolbar{padding:10px 14px}
    #q{width:100%;margin-left:0}
    .grid{padding:16px 14px 70px;gap:18px 14px;
      grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  }
</style>
</head>
<body>

<header>
  <h1>我的书架</h1>
  <span class="count" id="count"></span>
  <div class="spacer"></div>
  <button class="primary" id="btnAdd">+ 加书</button>
  <button id="btnUpdateAll">⟳ 追更</button>
  <button class="icon" id="btnTheme" title="切换主题">◐</button>
</header>

<div class="toolbar" id="toolbar"></div>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="dock" id="dock">
  <div class="dock-top">
    <span class="dock-title" id="dockTitle">准备中…</span>
    <span class="dock-sub" id="dockSub"></span>
    <button class="sm" id="dockAbort">停止</button>
  </div>
  <div class="track"><i id="dockBar" style="width:0%"></i></div>
  <div class="dock-foot">
    <span id="dockStat"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="dockEta"></span>
  </div>
</div>

<!-- 加书 -->
<div class="mask" id="maskAdd">
  <div class="modal">
    <div class="modal-hd">
      <h2>加一本书</h2>
      <div class="spacer"></div>
      <button class="icon" data-close>✕</button>
    </div>
    <div class="modal-bd">
      <div class="addrow">
        <input type="text" id="addInput" placeholder="粘贴书籍链接，或直接输入数字 id">
        <button class="primary" id="btnAddGo">加入书架</button>
      </div>
      <div class="hintline">
        链接形如 <code>https://fanqienovel.com/page/7686…</code>，从浏览器地址栏或 App 分享里复制即可。
      </div>

      <div style="margin-top:26px;border-top:1px solid var(--line);padding-top:20px">
        <div class="addrow">
          <input type="search" id="searchInput" placeholder="不知道 id？搜书名或作者">
          <button id="btnSearch">搜索</button>
        </div>
        <div class="results" id="results"></div>
      </div>
    </div>
    <div class="modal-ft">
      <button data-close>关闭</button>
    </div>
  </div>
</div>

<div class="ctx" id="ctx"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 状态 ================= */
const S = {
  books: [],
  filter: 'all',
  q: '',
  theme: 'light',
  job: null,
  busyBook: null,     // 当前正在下载的 bookId
  lastProg: null,
};
const KEY = 'fanqie-app-ui';

const $ = s => document.querySelector(s);
const grid = $('#grid'), toastEl = $('#toast'), ctx = $('#ctx');

function toast(m){
  toastEl.textContent = m;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= 主题 ================= */
const THEMES = ['light', 'warm', 'dark'];
function applyTheme(){
  document.documentElement.dataset.theme = S.theme === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.variant = S.theme === 'warm' ? 'warm' : '';
}
$('#btnTheme').onclick = () => {
  S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length];
  applyTheme(); saveUI();
  toast({light:'日间', warm:'暖色', dark:'夜间'}[S.theme]);
};

function saveUI(){
  localStorage.setItem(KEY, JSON.stringify({ theme: S.theme, filter: S.filter }));
  if (S.q) localStorage.setItem(KEY + '-q', S.q); else localStorage.removeItem(KEY + '-q');
}

/* ================= 数据 ================= */
async function api(path, opts){
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

async function loadShelf(showErr = true){
  try {
    const { books, job } = await api('/api/shelf');
    S.books = books;
    S.job = job && job.running ? job : null;
    render();
  } catch (e) {
    if (showErr) toast('读取书架失败：' + e.message);
  }
}

/* ================= 工具条 ================= */
function buildToolbar(){
  const has = {
    all: S.books.length,
    ongoing: S.books.filter(b => !b.finished && b.downloaded >= b.chapters).length,
    done: S.books.filter(b => b.finished && b.downloaded >= b.chapters).length,
    auto: S.books.filter(b => b.autoUpdate !== false && !(b.finished && b.downloaded >= b.chapters)).length,
    manual: S.books.filter(b => b.autoUpdate === false).length,
    partial: S.books.filter(b => b.downloaded < b.chapters).length,
  };
  const items = [
    ['all', '全部', has.all],
    ['ongoing', '连载中', has.ongoing],
    ['done', '已完结', has.done],
    ['auto', '自动追更', has.auto],
    ['manual', '不追更', has.manual],
    ['partial', '未下完', has.partial],
  ];
  const tb = $('#toolbar');
  tb.innerHTML = '';
  for (const [k, label, n] of items){
    if (k !== 'all' && !n) continue;
    const c = document.createElement('div');
    c.className = 'chip' + (S.filter === k ? ' on' : '');
    c.innerHTML = esc(label) + '<b>' + n + '</b>';
    c.onclick = () => { S.filter = k; buildToolbar(); render(); saveUI(); };
    tb.appendChild(c);
  }

  const q = document.createElement('input');
  q.type = 'search'; q.id = 'q'; q.placeholder = '搜书名 / 作者';
  q.value = S.q;
  let qt;
  q.oninput = e => {
    clearTimeout(qt);
    const v = e.target.value.trim();
    qt = setTimeout(() => { S.q = v; render(); saveUI(); }, 150);
  };
  tb.appendChild(q);
}

/* ================= 渲染书架 ================= */
function matches(b){
  const allDone = b.downloaded >= b.chapters;
  if (S.filter === 'ongoing' && (b.finished || !allDone)) return false;
  if (S.filter === 'done' && (!b.finished || !allDone)) return false;
  if (S.filter === 'auto' && (b.autoUpdate === false || (b.finished && allDone))) return false;
  if (S.filter === 'manual' && b.autoUpdate !== false) return false;
  if (S.filter === 'partial' && allDone) return false;
  if (S.q){
    const k = S.q.toLowerCase();
    if (!(b.title + ' ' + b.author).toLowerCase().includes(k)) return false;
  }
  return true;
}

function render(){
  buildToolbar();

  const list = S.books.filter(matches);
  $('#count').textContent = list.length === S.books.length
    ? `共 ${S.books.length} 本`
    : `${list.length} / ${S.books.length} 本`;

  grid.innerHTML = '';

  if (!S.books.length){
    grid.innerHTML = `
      <div class="empty">
        <h2>书架还是空的</h2>
        <p>点右上角「+ 加书」，粘贴番茄小说链接或书籍 id 就能下载到本地。</p>
        <button class="primary" onclick="document.getElementById('btnAdd').click()">+ 加第一本书</button>
      </div>`;
    return;
  }

  if (!list.length){
    grid.innerHTML = '<div class="empty"><h2>没有符合条件的书</h2></div>';
    return;
  }

  const frag = document.createDocumentFragment();
  for (const b of list) frag.appendChild(card(b));
  grid.appendChild(frag);
}

function card(b){
  const el = document.createElement('div');
  el.className = 'book';
  el.dataset.id = b.bookId;

  const pct = b.chapters ? Math.round(b.downloaded / b.chapters * 100) : 0;
  const running = S.job && (S.busyBook === b.bookId);
  const isPartial = b.downloaded < b.chapters;

  let badge = '';
  if (running) badge = '<span class="badge part">下载中</span>';
  else if (isPartial) badge = `<span class="badge part">${b.downloaded}/${b.chapters} 章</span>`;
  else if (b.finished) badge = '<span class="badge done">完结</span>';
  else if (b.autoUpdate === false) badge = '<span class="badge off">不追更</span>';

  const cover = b.coverUrl
    ? `<img class="bg" src="${b.coverUrl}" alt="" aria-hidden="true" loading="lazy">
       <img class="fg" src="${b.coverUrl}" alt="" loading="lazy">`
    : `<div class="ph">${esc(b.title)}</div>`;

  // 完结且已下完 → 不再抓取，开关锁死
  // 完结但还缺章 → 仍需补齐，开关保留可用
  const allDone = b.downloaded >= b.chapters;
  const locked = b.finished && allDone;
  const switchedOn = b.autoUpdate !== false && !locked;

  el.innerHTML = `
    <div class="coverwrap" data-open>
      <div class="cover">
        ${cover}
        ${badge}
        ${isPartial || running ? `<div class="progress${running ? ' run' : ''}"><i style="width:${running ? 100 : pct}%"></i></div>` : ''}
      </div>
    </div>
    <div class="meta">
      <div class="title">${esc(b.title)}</div>
      <div class="sub">
        <span>${esc(b.author || '佚名')}</span>
        ${b.words ? `<span class="dot">·</span><span>${esc(b.wordsText)}</span>` : ''}
      </div>
      <div class="ops">
        <label class="switch ${locked ? 'locked' : ''} ${switchedOn ? 'on-label' : ''}"
               title="${locked ? '已完结，不再抓取' : '开启后每次追更会抓最新章节'}">
          <input type="checkbox" ${switchedOn ? 'checked' : ''} ${locked ? 'disabled' : ''} data-toggle>
          <i></i>
        </label>
        <button class="more" data-more title="更多">⋯</button>
      </div>
    </div>`;

  // 打开阅读器
  el.querySelector('[data-open]').onclick = () => {
    if (b.downloaded === 0) return toast('这本书还没下载内容');
    window.location.href = '/reader/' + b.bookId;
  };

  // 自动追更开关
  const sw = el.querySelector('[data-toggle]');
  sw.onchange = async () => {
    const on = sw.checked;
    try {
      await api('/api/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookId: b.bookId, autoUpdate: on }),
      });
      b.autoUpdate = on;
      const lab = sw.closest('.switch');
      lab.classList.toggle('on-label', on);
      toast(on ? `《${b.title}》会抓最新章节` : `《${b.title}》不再自动抓取`);
      buildToolbar();
      // 开关不影响当前筛选结果的可见性需要重渲染
      if (S.filter === 'auto' || S.filter === 'manual') render();
    } catch (e) {
      sw.checked = !on;
      toast('设置失败：' + e.message);
    }
  };

  // 更多菜单
  el.querySelector('[data-more]').onclick = e => {
    e.stopPropagation();
    openCtx(e.currentTarget, b);
  };

  return el;
}

/* ================= 右键 / 更多菜单 ================= */
function openCtx(anchor, b){
  const r = anchor.getBoundingClientRect();
  const items = [];
  if (b.downloaded > 0) items.push(['打开阅读', () => { window.location.href = '/reader/' + b.bookId; }]);
  if (!b.finished) items.push(['立即追更这本', () => startUpdate([b.bookId])]);
  items.push(['导出 TXT', () => doTxt(b)]);
  items.push(['──', null]);
  items.push(['移出书架', () => doRemove(b), true]);

  ctx.innerHTML = '';
  for (const [label, fn, danger] of items){
    if (label === '──'){ ctx.appendChild(document.createElement('hr')); continue; }
    const btn = document.createElement('button');
    btn.textContent = label;
    if (danger) btn.className = 'danger';
    btn.onclick = () => { hideCtx(); fn(); };
    ctx.appendChild(btn);
  }

  ctx.classList.add('show');
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  let x = r.right - w, y = r.bottom + 6;
  if (y + h > innerHeight - 10) y = r.top - h - 6;
  ctx.style.left = Math.max(8, x) + 'px';
  ctx.style.top = Math.max(8, y) + 'px';
}
function hideCtx(){ ctx.classList.remove('show'); }
document.addEventListener('click', hideCtx);
window.addEventListener('blur', hideCtx);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtx(); });

async function doRemove(b){
  const ok = confirm(
    `从书架移除《${b.title}》？\n\n` +
    `缓存的章节内容和阅读器文件会移到 .cache/.trash/ 下，不会直接删除，\n` +
    `需要的话可以手动找回。`
  );
  if (!ok) return;
  try {
    const r = await api('/api/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookId: b.bookId }),
    });
    toast(r.moved ? `已移出书架（${r.moved} 个文件存入 .trash）` : '已移出书架');
    loadShelf();
  } catch (e) { toast('移除失败：' + e.message); }
}

async function doTxt(b){
  toast('正在导出…');
  try {
    const r = await api('/api/txt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookId: b.bookId }),
    });
    toast(`已导出 ${r.chapters} 章 → books/${r.file.split(/[\\/]/).pop()}`);
  } catch (e) { toast('导出失败：' + e.message); }
}

/* ================= 加书 ================= */
$('#btnAdd').onclick = () => {
  $('#maskAdd').classList.add('show');
  setTimeout(() => $('#addInput').focus(), 40);
};
document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = () => $('#maskAdd').classList.remove('show');
});
$('#maskAdd').onclick = e => { if (e.target.id === 'maskAdd') $('#maskAdd').classList.remove('show'); };

async function addBook(input){
  if (!input || !input.trim()) return toast('先粘贴链接或 id');
  try {
    await api('/api/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: input.trim() }),
    });
    $('#maskAdd').classList.remove('show');
    $('#addInput').value = '';
    showDock('加书中…');
  } catch (e) { toast(e.message); }
}
$('#btnAddGo').onclick = () => addBook($('#addInput').value);
$('#addInput').onkeydown = e => { if (e.key === 'Enter') addBook($('#addInput').value); };

/* ---------- 搜索 ---------- */
let searching = false;
async function doSearch(){
  const kw = $('#searchInput').value.trim();
  if (!kw || searching) return;
  searching = true;
  const box = $('#results');
  box.innerHTML = '<div class="hintline">搜索中…</div>';
  try {
    const { books } = await api('/api/search?q=' + encodeURIComponent(kw));
    if (!books.length){ box.innerHTML = '<div class="hintline">没搜到，换个关键词，或者直接粘贴书籍链接。</div>'; return; }
    box.innerHTML = '';
    books.forEach((b, i) => {
      const row = document.createElement('div');
      row.className = 'result';
      row.innerHTML = `
        <span class="n">${i + 1}</span>
        <div class="body">
          <div class="rt">${esc(b.title)}</div>
          <div class="ra">${esc(b.author || '佚名')} · ${b.finished ? '完结' : '连载'} · ${esc(b.wordsText || '')}${b.category ? ' · ' + esc(b.category) : ''}</div>
        </div>
        ${b.inShelf ? '<span class="tag mine">书架</span>' : ''}
        <span class="tag ${b.finished ? 'fin' : ''}">${b.finished ? '完结' : '连载'}</span>
        <button class="sm ${b.inShelf ? '' : 'primary'}">${b.inShelf ? '已在书架' : '加入'}</button>`;
      const btn = row.querySelector('button');
      if (!b.inShelf) btn.onclick = () => addBook(b.bookId);
      else btn.disabled = true;
      box.appendChild(row);
    });
  } catch (e) {
    box.innerHTML = '<div class="hintline">搜索失败：' + esc(e.message) + '</div>';
  } finally { searching = false; }
}
$('#btnSearch').onclick = doSearch;
$('#searchInput').onkeydown = e => { if (e.key === 'Enter') doSearch(); };

/* ================= 追更 ================= */
async function startUpdate(ids){
  try {
    await api('/api/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookIds: ids || null }),
    });
    showDock(ids && ids.length === 1 ? '追更中…' : '批量追更…');
  } catch (e) { toast(e.message); }
}
$('#btnUpdateAll').onclick = () => startUpdate(null);
$('#dockAbort').onclick = async () => {
  try { await api('/api/abort', { method: 'POST' }); toast('已请求停止'); } catch {}
};

/* ================= 进度坞 ================= */
function showDock(title){
  $('#dockTitle').textContent = title;
  $('#dockSub').textContent = '';
  $('#dockStat').textContent = '';
  $('#dockEta').textContent = '';
  $('#dockBar').style.width = '0%';
  $('#dock').classList.add('show');
}
function hideDock(delay = 1400){
  setTimeout(() => $('#dock').classList.remove('show'), delay);
}

function onProgress(ev){
  if (ev.phase === 'catalog'){
    S.busyBook = null;
    showDock('读取目录…');
    return;
  }
  if (ev.phase === 'begin'){
    S.busyBook = ev.bookId;
    showDock(`《${ev.title}》`);
    $('#dockSub').textContent = `共 ${ev.chapters} 章` + (ev.cached ? ` · 已有 ${ev.cached} 章` : '');
    $('#dockStat').textContent = ev.total ? `待下载 ${ev.total} 章` : '已是最新';
    render();
    return;
  }
  if (ev.phase === 'download'){
    const p = ev.total ? Math.round(ev.done / ev.total * 100) : 100;
    $('#dockBar').style.width = p + '%';
    $('#dockTitle').textContent = `《${ev.title}》`;
    $('#dockStat').textContent = `${ev.done} / ${ev.total} 章` + (ev.failed ? ` · ${ev.failed} 章失败` : '');
    $('#dockEta').textContent = `${ev.rate} 章/秒 · 剩 ${ev.eta}s`;
    return;
  }
  if (ev.phase === 'cover'){ $('#dockStat').textContent = '处理封面…'; return; }
  if (ev.phase === 'reader'){ $('#dockStat').textContent = '生成阅读器…'; return; }
  if (ev.phase === 'done'){
    $('#dockBar').style.width = '100%';
    $('#dockSub').textContent = `${ev.full}/${ev.chapters} 章`;
    $('#dockStat').textContent = ev.failed.length ? `${ev.failed.length} 章失败，可再追一次` : '完成';
    $('#dockEta').textContent = '';
    S.busyBook = null;
    loadShelf();
    hideDock(2200);
    toast(ev.failed.length ? `《${ev.title}》下完了，${ev.failed.length} 章失败` : `《${ev.title}》已下载完成`);
    return;
  }

  // 追更流程
  if (ev.phase === 'check'){
    S.busyBook = ev.bookId;
    showDock(`检查《${ev.title}》…`);
    $('#dockSub').textContent = `${ev.index}/${ev.count}`;
    return;
  }
  if (ev.phase === 'skip'){
    $('#dockStat').textContent = `跳过《${ev.title}》— ${ev.reason}`;
    return;
  }
  if (ev.phase === 'error'){
    toast(`《${ev.title}》失败：${ev.message}`);
    return;
  }
  if (ev.phase === 'all-done'){
    S.busyBook = null;
    const parts = [`检查 ${ev.checked} 本`];
    if (ev.changed) parts.push(`${ev.changed} 本有更新`);
    if (ev.skippedFinished) parts.push(`跳过已完结 ${ev.skippedFinished}`);
    if (ev.skippedOff) parts.push(`跳过不追更 ${ev.skippedOff}`);
    if (ev.failed.length) parts.push(`${ev.failed.length} 本失败`);
    $('#dockTitle').textContent = '追更完成';
    $('#dockBar').style.width = '100%';
    $('#dockStat').textContent = parts.join(' · ');
    $('#dockEta').textContent = '';
    loadShelf();
    hideDock(2600);
    toast(ev.changed ? `${ev.changed} 本有新章节` : '全部是最新的');
    return;
  }
}

/* ================= SSE ================= */
function connectSSE(){
  const es = new EventSource('/api/events');

  es.addEventListener('hello', e => {
    const d = JSON.parse(e.data);
    if (d.job && d.job.running){ showDock('任务进行中…'); }
  });

  es.addEventListener('progress', e => {
    try { onProgress(JSON.parse(e.data)); } catch {}
  });

  es.addEventListener('job', e => {
    const d = JSON.parse(e.data);
    S.job = d.running ? d : null;
    if (d.running) $('#btnUpdateAll').disabled = true;
    else {
      $('#btnUpdateAll').disabled = false;
      render();
    }
  });

  es.addEventListener('job-done', () => {
    S.job = null;
    S.busyBook = null;
    $('#btnUpdateAll').disabled = false;
    loadShelf();
  });

  es.addEventListener('job-error', e => {
    const d = JSON.parse(e.data);
    S.job = null;
    S.busyBook = null;
    $('#btnUpdateAll').disabled = false;
    toast(d.message || '任务失败');
    $('#dockTitle').textContent = '任务中断';
    $('#dockStat').textContent = d.message || '';
    hideDock(3200);
    loadShelf();
  });

  es.onerror = () => {
    // EventSource 会自动重连；服务被关掉时静默即可
  };
}

/* ================= 启动 ================= */
(function init(){
  try {
    const ui = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (ui.theme) S.theme = ui.theme;
    if (ui.filter) S.filter = ui.filter;
    S.q = localStorage.getItem(KEY + '-q') || '';
  } catch {}

  applyTheme();
  loadShelf();
  connectSSE();

  document.addEventListener('keydown', e => {
    if (e.key === '/' && !['INPUT','TEXTAREA'].includes(e.target.tagName)){
      e.preventDefault();
      const q = $('#q'); if (q) q.focus();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n'){ e.preventDefault(); $('#btnAdd').click(); }
  });

  // 定时轻量刷新（封面/进度等变化）
  setInterval(() => { if (!S.job) loadShelf(false); }, 30000);
})();
</script>
