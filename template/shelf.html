<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的书架</title>
<style>
  :root{
    --bg:#faf8f5; --fg:#2b2724; --sub:#8a827a; --line:#e6e0d8;
    --card:#ffffff; --accent:#c0392b; --sel:#f3ece4;
    --font:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#1a1a1c; --fg:#c9c6c1; --sub:#7d7973; --line:#302e2c;
    --card:#212123; --accent:#e07a6a; --sel:#2b2927;
  }
  html[data-variant="warm"]{
    --bg:#f7efe2; --fg:#3d3428; --sub:#8d7f68; --line:#e3d6bf;
    --card:#fdf8ef; --accent:#a0522d; --sel:#efe3cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);font-family:var(--sans);
    transition:background .2s,color .2s;min-height:100vh;
  }

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky;top:0;z-index:30;
    padding:18px 32px;display:flex;align-items:center;gap:14px;
    background:color-mix(in srgb,var(--bg) 90%,transparent);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  }
  h1{font-family:var(--font);font-size:21px;font-weight:600;letter-spacing:.03em}
  .count{color:var(--sub);font-size:12.5px;font-family:var(--sans)}
  .spacer{flex:1}
  button{
    font-family:var(--sans);font-size:13px;color:var(--fg);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  button:hover{background:var(--sel);border-color:var(--sub)}
  button.icon{padding:7px 10px;line-height:1}

  /* ---------- 筛选 ---------- */
  .filters{
    padding:14px 32px 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .chip{
    font-size:12.5px;padding:5px 12px;border-radius:16px;cursor:pointer;
    border:1px solid var(--line);color:var(--sub);background:transparent;
    transition:all .15s;
  }
  .chip:hover{color:var(--fg);border-color:var(--sub)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  input.search{
    margin-left:auto;padding:7px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--fg);font-family:var(--sans);font-size:13px;
    outline:none;width:200px;
  }
  input.search:focus{border-color:var(--accent)}

  /* ---------- 书Grid ---------- */
  .grid{
    display:grid;gap:26px 22px;padding:24px 32px 60px;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    align-content:start;
  }
  /* 宽屏下限制最大列宽，避免两本书时封面被拉得过大 */
  @media (min-width:900px){
    .grid{grid-template-columns:repeat(auto-fill,168px);justify-content:start}
  }
  .book{
    cursor:pointer;position:relative;text-decoration:none;color:inherit;
    transition:transform .18s ease;
  }
  .book:hover{transform:translateY(-3px)}
  .cover{
    position:relative;width:100%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;
    background:var(--sel);box-shadow:0 2px 8px rgba(0,0,0,.09),0 8px 24px rgba(0,0,0,.05);
    transition:box-shadow .18s ease;
  }
  .book:hover .cover{box-shadow:0 4px 14px rgba(0,0,0,.14),0 12px 32px rgba(0,0,0,.09)}
  /* 底层：同一张图放大模糊，填满容器，避免留白 */
  .cover .bg{
    position:absolute;inset:-10%;width:120%;height:120%;
    object-fit:cover;filter:blur(16px) saturate(1.15) brightness(.82);
    opacity:.85;display:block;
  }
  /* 上层：完整封面，等比显示，绝不裁切 */
  .cover .fg{
    position:relative;width:100%;height:100%;object-fit:contain;display:block;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.22));
  }
  .cover .ph{
    position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    padding:16px;text-align:center;font-family:var(--font);font-size:14px;line-height:1.5;
    color:var(--sub);word-break:break-all;
  }
  .badge{
    position:absolute;top:7px;right:7px;font-size:10.5px;padding:2px 7px;border-radius:4px;
    background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(4px);
    font-family:var(--sans);letter-spacing:.02em;
  }
  .badge.done{background:rgba(45,122,74,.85)}
  .badge.part{background:rgba(196,124,32,.88)}
  .progress{
    position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.25);
  }
  .progress i{display:block;height:100%;background:var(--accent)}

  .meta{padding:10px 2px 0}
  .title{
    font-family:var(--font);font-size:14px;font-weight:600;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .sub{font-size:11.5px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center}
  .sub .dot{opacity:.5}

  /* ---------- 空状态 ---------- */
  .empty{
    grid-column:1/-1;text-align:center;padding:90px 20px;color:var(--sub);
  }
  .empty h2{font-family:var(--font);font-size:17px;font-weight:500;margin-bottom:10px;color:var(--fg)}
  .empty p{font-size:13px;line-height:1.9}
  .empty code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    background:var(--sel);padding:2px 7px;border-radius:4px;
  }

  /* ---------- 提示 ---------- */
  .hint{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);
    background:rgba(0,0,0,.8);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:20px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:60;
  }
  .hint.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:700px){
    header{padding:14px 16px}
    h1{font-size:18px}
    .filters{padding:12px 16px 2px}
    input.search{width:100%;margin-left:0;margin-top:6px}
    .grid{padding:16px 16px 50px;gap:16px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  }
</style>
</head>
<body>

<header>
  <h1>我的书架</h1>
  <span class="count" id="count"></span>
  <div class="spacer"></div>
  <input class="search" id="q" type="search" placeholder="搜书名 / 作者">
  <button class="icon" id="btnTheme" title="切换主题">◐</button>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<div class="hint" id="hint"></div>

<script>
const BOOKS = /*__SHELF_DATA__*/[];

const $ = s => document.querySelector(s);
const grid = $('#grid'), filters = $('#filters');
const KEY = 'fanqie-shelf-ui';
let ui = { theme: 'light', filter: 'all', q: '' };
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}

/* ---------- 主题 ---------- */
const THEMES = ['light', 'warm', 'dark'];
function applyTheme(){
  const t = ui.theme;
  document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.variant = t === 'warm' ? 'warm' : '';
  localStorage.setItem(KEY, JSON.stringify(ui));
}
$('#btnTheme').onclick = () => {
  ui.theme = THEMES[(THEMES.indexOf(ui.theme) + 1) % THEMES.length];
  applyTheme();
  toast({light:'日间', warm:'暖色', dark:'夜间'}[ui.theme]);
};

/* ---------- 提示 ---------- */
function toast(m){
  const h = $('#hint'); h.textContent = m; h.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => h.classList.remove('show'), 1500);
}

/* ---------- 筛选区 ---------- */
function buildFilters(){
  const has = {
    all: BOOKS.length,
    reading: BOOKS.filter(b => !b.f && b.d > 0).length,
    done: BOOKS.filter(b => b.f).length,
    partial: BOOKS.filter(b => b.d < b.c).length,
  };
  const items = [
    ['all', '全部', has.all],
    ['reading', '连载中', has.reading],
    ['done', '已完结', has.done],
    ['partial', '未下完', has.partial],
  ];
  filters.innerHTML = '';
  for (const [k, label, n] of items){
    if (k !== 'all' && !n) continue;
    const c = document.createElement('div');
    c.className = 'chip' + (ui.filter === k ? ' on' : '');
    c.textContent = label + (k === 'all' ? ' ' + n : ' ' + n);
    c.onclick = () => { ui.filter = k; buildFilters(); render(); localStorage.setItem(KEY, JSON.stringify(ui)); };
    filters.appendChild(c);
  }
}

/* ---------- 渲染 ---------- */
function matches(b){
  if (ui.filter === 'reading' && b.f) return false;
  if (ui.filter === 'done' && !b.f) return false;
  if (ui.filter === 'partial' && b.d >= b.c) return false;
  if (ui.q){
    const k = ui.q.toLowerCase();
    if (!(b.t + ' ' + b.a).toLowerCase().includes(k)) return false;
  }
  return true;
}

function fmtWords(w){
  if (!w) return '';
  return w >= 10000 ? (w / 10000).toFixed(1) + '万字' : w + '字';
}

function render(){
  const list = BOOKS.filter(matches);
  $('#count').textContent = list.length === BOOKS.length
    ? `共 ${BOOKS.length} 本`
    : `${list.length} / ${BOOKS.length} 本`;

  grid.innerHTML = '';

  if (!BOOKS.length){
    grid.innerHTML = `
      <div class="empty">
        <h2>书架还是空的</h2>
        <p>先用命令行下载一本书：<br><br>
        <code>node fanqie.mjs read &lt;书籍id 或 链接&gt;</code><br><br>
        下载完成后重新打开本页。</p>
      </div>`;
    return;
  }

  if (!list.length){
    grid.innerHTML = '<div class="empty"><h2>没有符合条件的书</h2></div>';
    return;
  }

  const frag = document.createDocumentFragment();
  for (const b of list){
    const a = document.createElement('a');
    a.className = 'book';
    a.href = 'books/' + encodeURIComponent(b.i) + '.html';
    a.title = b.t + (b.a ? ' · ' + b.a : '');

    const pct = b.c ? Math.round(b.d / b.c * 100) : 0;

    let badge = '';
    if (b.d < b.c) badge = `<span class="badge part">${b.d}/${b.c} 章</span>`;
    else if (b.f) badge = '<span class="badge done">完结</span>';

    const cover = b.v
      ? `<img class="bg" src="${b.v}" alt="" aria-hidden="true" loading="lazy">
         <img class="fg" src="${b.v}" alt="" loading="lazy">`
      : `<div class="ph">${escapeHtml(b.t)}</div>`;

    a.innerHTML = `
      <div class="cover">
        ${cover}
        ${badge}
        ${b.d < b.c ? `<div class="progress"><i style="width:${pct}%"></i></div>` : ''}
      </div>
      <div class="meta">
        <div class="title">${escapeHtml(b.t)}</div>
        <div class="sub">
          <span>${escapeHtml(b.a || '佚名')}</span>
          ${b.w ? `<span class="dot">·</span><span>${fmtWords(b.w)}</span>` : ''}
        </div>
      </div>`;
    // 没生成阅读器时拦截
    a.onclick = e => {
      if (b.d === 0){ e.preventDefault(); toast('这本书还没下载内容'); }
    };
    frag.appendChild(a);
  }
  grid.appendChild(frag);
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 搜索 ---------- */
let qt;
$('#q').oninput = e => {
  clearTimeout(qt);
  const v = e.target.value.trim();
  qt = setTimeout(() => { ui.q = v; render(); localStorage.setItem(KEY, JSON.stringify(ui)); }, 160);
};

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', e => {
  if (e.key === '/' && e.target.tagName !== 'INPUT'){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape'){ $('#q').value = ''; ui.q = ''; render(); $('#q').blur(); }
});

/* ---------- 启动 ---------- */
applyTheme();
buildFilters();
render();
if (BOOKS.length) toast('点击封面开始阅读　/ 搜索');
</script>
</body>
</html>
